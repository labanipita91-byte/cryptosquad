<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoSquad Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- THE GATEKEEPER (Hard Wall) -->
    <div id="gate-wall" class="modal-full" style="display:none;">
        <div class="modal-content">
            <h2 style="color:var(--primary)">Arena Access Required</h2>
            <p>Trial Expired. Choose your weekly tier to continue.</p>
            <div class="tier-card" onclick="buyTier(1)"><h3>BRONZE</h3><p>3 Coins | 50 Stars/wk</p></div>
            <div class="tier-card" onclick="buyTier(2)"><h3>SILVER</h3><p>10 Coins | 100 Stars/wk</p></div>
            <div class="tier-card gold" onclick="buyTier(3)"><h3>GOLD VIP</h3><p>Unlimited | 200 Stars/wk</p></div>
        </div>
    </div>

    <div id="main-app" class="container">
        <header class="top-nav">
            <h2 id="user-display">...</h2>
            <div id="sub-badge" class="badge" onclick="showGate()">💎 PRO</div>
        </header>

        <main>
            <!-- DASHBOARD -->
            <section id="view-dashboard">
                <div class="balance-card">
                    <small>Portfolio Balance</small>
                    <h1 id="total-val">$0.00</h1>
                    <div id="total-change">+0.00% (24h)</div>
                </div>
                <div class="actions">
                    <button class="btn-p" onclick="showView('view-add')">+ Add Coin</button>
                    <button class="btn-s" onclick="showView('view-groups')">Squads</button>
                </div>
                <div class="section-title">My Assets</div>
                <div id="asset-list"></div>
            </section>

            <!-- SQUADS -->
            <section id="view-groups" style="display:none;">
                <button class="btn-back-y" onclick="showView('view-dashboard')">← Back</button>
                <div class="section-title">Squads I Created</div>
                <div id="created-list"></div>
                <div class="section-title" style="margin-top:15px">Joined Squads</div>
                <div id="joined-list"></div>
                <div class="form-card" style="margin-top:25px">
                    <input type="text" id="new-sq-name" placeholder="New Squad Name">
                    <button class="btn-p" onclick="createGroup()">Create Squad</button>
                    <div style="text-align:center; margin:10px; color:gray">OR</div>
                    <input type="text" id="join-code" placeholder="Invite Code">
                    <button class="btn-s" style="width:100%" onclick="joinGroup()">Join Squad</button>
                </div>
            </section>

            <!-- LEADERBOARD -->
            <section id="view-active-squad" style="display:none;">
                <button class="btn-back-y" onclick="showView('view-groups')">← Back</button>
                <div id="sq-header">
                    <h2 id="sq-name-display" style="margin-bottom:0"></h2>
                    <small id="sq-owner" style="color:gray"></small>
                </div>
                <div class="code-box">
                    <span id="sq-code-display"></span>
                    <button onclick="copyCode()" class="btn-copy">COPY</button>
                </div>
                <button class="btn-p" onclick="shareSquad()">📢 Invite Friends</button>
                <div class="section-title">Leaderboard (↑ Growth)</div>
                <div id="leaderboard-list"></div>
            </section>

            <!-- ADD COIN -->
            <section id="view-add" style="display:none;">
                <button class="btn-back-y" onclick="showView('view-dashboard')">← Back</button>
                <div class="form-card">
                    <input type="text" id="coin-id" placeholder="bitcoin, solana..."><input type="number" id="coin-amount" placeholder="0.5"><button class="btn-p" onclick="addAsset()">Save Asset</button>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
                      </html>
